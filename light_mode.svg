    }
    .portrait {
      font-size: 11.5px;
      fill: #0969da;
      font-weight: 500;
    }
    .info {
      font-size: 14.5px;
      font-weight: 400;
    }
    .term-hdr { fill: #24292f; font-weight: 700; }
    .term-sec { fill: #24292f; font-weight: 600; }
    .term-key { fill: #953800; font-weight: 500; }
    .term-dot { fill: #8c959f; opacity: 0.85; }
    .term-val { fill: #0a3069; }
    .term-rule { fill: #d0d7de; }
    .term-add { fill: #1a7f37; font-weight: 600; }
    .term-del { fill: #cf222e; font-weight: 600; }
    .window-title { fill: #57606a; font-size: 13px; font-weight: 500; }
  </style>

