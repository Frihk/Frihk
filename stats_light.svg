<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 170" width="450" height="170" role="img" aria-labelledby="stats-title stats-desc">
  <title id="stats-title">Ian Kimani's GitHub Statistics (Light Mode)</title>
  <desc id="stats-desc">Total Commits: 1,617, Total PRs: 30, Total Issues: 42, Public Repos: 41, Followers: 5</desc>
  <style>
    .stat-label {
      font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #0b2a5c;
    }
    .stat-val {
      font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #0b2a5c;
    }
    .rank-text {
      font: 800 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      fill: #0b2a5c;
    }
    .stagger {
      opacity: 0;
      animation: fadeIn 0.35s ease-in-out forwards;
    }
    .rank-progress {
      stroke-dasharray: 251.3;
      stroke-dashoffset: 45.0;
      transform: rotate(-90deg);
      transform-origin: 355px 85px;
      animation: rankAnim 1s forwards ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(15px, var(--y, 0)); }
      to { opacity: 1; }
    }
    @keyframes rankAnim {
      from { stroke-dashoffset: 251.3; }
      to { stroke-dashoffset: 45.0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .stagger, .rank-progress { animation: none; opacity: 1; }
    }
  </style>

  <g class="stagger" style="animation-delay: 0ms" transform="translate(20, 22)">
